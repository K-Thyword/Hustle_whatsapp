<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hustleapp Dashboard — Sign in</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <form id="loginForm" class="login-card">
    <h1>Hustleapp Dashboard</h1>
    <p class="muted">Enter the shared password to continue.</p>
    <input id="password" type="password" placeholder="Password" autofocus required />
    <button type="submit">Sign in</button>
    <p id="error" class="error"></p>
  </form>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = "/";
        } else {
          errorEl.textContent = data.error || "Something went wrong.";
        }
      } catch {
        errorEl.textContent = "Couldn't reach the server — try again.";
      }
    });
  </script>
</body>
</html>
